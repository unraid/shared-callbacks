name: Build and Publish
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for release-please to create branches and PRs
  pull-requests: write # Required for release-please to create pull requests

jobs:
  release-please:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@v5
        if: github.ref == 'refs/heads/main'
        id: release
        with:
          release-type: node
  build:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: always() && (needs.release-please.result == 'success' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          submodules: recursive

      - name: Set Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: test
        run: pnpm run test:coverage

      - name: Upload all coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Publish to NPM
        if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            test "$(node -p "'v' + require('./package.json').version")" = "$RELEASE_TAG"
          fi
          git status --short
          pnpm publish --no-git-checks

      - name: Send Discord notification
        if: ${{ needs.release-please.outputs.release_created }}
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            📚 Shared Callback Library ${{ needs.release-please.outputs.tag_name }} created!

            **Changelog:**
            ${{ needs.release-please.outputs.body }}
